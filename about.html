  <div class="post-body">
    <p>你好，我是<strong>林间</strong>，一个把写字当作过日子方式的人。</p>
    <p>白天在屏幕里讨生活，晚上回到纸面上。读得多的时候写书评，心里有风的时候写诗，其余的日子，记一点随笔——关于食物、天气、路上的人，以及所有来不及命名的心情。</p>
    <p>这里没有宏大的主题，只有一些诚实的句子。如果你在某一段里认出了自己，那我们就算认识了。</p>
