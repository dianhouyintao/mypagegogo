    <h1 class="post-heading">立冬</h1>
    <div class="post-meta">
      <time datetime="2026-11-01">2026 年 11 月 1 日</time>
      <span class="tag tag-cat-poetry">诗歌</span>
    </div>
  </header>
  <div class="post-body">
<p>风把最后一片银杏<br>按在石阶上<br>像盖了一个邮戳</p>
<p>从此<br>寄出去的话都带着凉意<br>收到的回信<br>越读越要靠近炉火</p>
<p>母亲在电话里说<br>添一件衣服吧<br>我说好<br>其实我添的是一句<br>没说出口的想念</p>
<p>夜长了<br>梦也就深了<br>我在梦里修一座桥<br>从我的窗<br>修到你的屋檐</p>
<p>醒来时霜落了满院<br>每一个脚印<br>都是白色的逗号<br>句子还没说完<br>冬天就来了</p>
  </div>
